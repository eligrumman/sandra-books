<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>אפשרות 6 · מעוף בין היצירות</title><link rel="stylesheet" href="../shared.css">
<style>
body{background:radial-gradient(ellipse at center,#1a1630 0%,#07060b 70%) fixed}
.track{height:calc(var(--n) * var(--per,55vh) + 100vh)}
.scene{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;perspective:900px;perspective-origin:50% 50%}
.space{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.card{position:absolute;left:50%;top:50%;transform-style:preserve-3d;cursor:pointer}
.card img{width:100%;height:100%;object-fit:cover;box-shadow:0 30px 90px rgba(0,0,0,.7);border-radius:3px}
.card figcaption{position:absolute;top:100%;margin-top:12px;font-size:13px;white-space:nowrap;color:#ddd}
.card figcaption b{display:block;font-family:var(--serif);font-weight:300;font-size:22px;color:#fff}
.intro{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none;z-index:2}
.intro h1{font-family:var(--serif);font-weight:300;font-size:clamp(60px,12vw,200px);line-height:.9;margin:0;letter-spacing:-.03em}
.intro h1 em{font-style:normal;color:var(--gold)}
.intro p{opacity:.8;font-size:17px}
.lb{position:fixed;z-index:120;inset:0;background:rgba(6,5,10,.96);display:grid;grid-template-rows:1fr auto;opacity:0;pointer-events:none;transition:opacity .3s}
.lb.open{opacity:1;pointer-events:auto}
.lb img{max-width:94vw;max-height:78vh;margin:auto;align-self:center;object-fit:contain;box-shadow:0 30px 90px #000}
.lb .c{text-align:center;padding:12px 16px calc(26px + env(safe-area-inset-bottom))}
.lb b{display:block;font-family:var(--serif);font-size:40px;line-height:1}
.lb span{color:#bbb;font-size:14px}
.card.focus img{box-shadow:0 0 0 3px var(--gold),0 30px 90px rgba(0,0,0,.7)}
.stop{position:absolute;left:0;width:1px;height:1px;scroll-snap-align:start}
@media (pointer:coarse){html{scroll-snap-type:y mandatory}}
.dust{position:absolute;inset:-50%;background-image:radial-gradient(1px 1px at 20% 30%,#fff8,transparent),radial-gradient(1px 1px at 70% 60%,#fff6,transparent),radial-gradient(1.5px 1.5px at 40% 80%,#fff5,transparent),radial-gradient(1px 1px at 85% 15%,#fff7,transparent);background-size:300px 300px;opacity:.5;pointer-events:none}
</style></head><body>
<header class="cbar"><a class="back" href="../">← כל האפשרויות</a><span class="name">Sandra <b>Leifer</b></span></header>
<section class="track" id="track"><div class="scene" id="scene"><div class="dust" id="dust"></div><div class="space" id="space"></div>
<div class="intro" id="intro"><div><h1>לעוף<br><em>בתוך הצבע.</em></h1><p>גללו קדימה — היצירות מחכות במרחב.</p></div></div></div></section>
<div class="lb" id="lb"><img id="lbimg" alt=""><div class="c"><b id="lbt"></b><span id="lbm"></span></div></div>
<script src="../../assets/js/images.js"></script><script src="../../assets/js/data.js"></script><script src="../shared.js"></script>
<script>
const $lb = document.getElementById('lb'); $lb.onclick = () => $lb.classList.remove('open');
const ids = C.best.slice(0, 18), gapZ = 900, space = document.getElementById('space'), track = document.getElementById('track');
const mobile = innerWidth < 700, FOCUS = mobile ? 260 : 520;
track.style.setProperty('--n', ids.length); if (mobile) track.style.setProperty('--per', '90vh');
const cards = ids.map((id, i) => {
  const ang = i * 2.39996, rad = (mobile ? .1 : .3) * innerWidth;
  const x = Math.cos(ang) * rad, y = Math.sin(ang) * rad * .55, z = -(i + 1) * gapZ;
  let h = (mobile ? .58 : .48) * innerHeight, w = h * C.ratio(id); if (mobile && w > innerWidth * .95) { w = innerWidth * .95; h = w / C.ratio(id); }
  const f = document.createElement('figure'); f.className = 'card'; f.style.margin = 0;
  f.style.width = w + 'px'; f.style.height = h + 'px';
  f.style.transform = `translate3d(${x - w / 2}px,${y - h / 2}px,${z}px)`;
  f.innerHTML = `<img src="${C.src(id, 1600)}" alt="${C.title(id)}" loading="${i < 4 ? 'eager' : 'lazy'}"><figcaption><b>${C.title(id)}</b>${C.meta(id)}</figcaption>`;
  f.onclick = () => { $lb.querySelector('img').src = C.src(id, 2400); document.getElementById('lbt').textContent = C.title(id); document.getElementById('lbm').textContent = C.meta(id); $lb.classList.add('open'); };
  space.append(f); return {f, z};
});
let mx = 0, my = 0;
addEventListener('pointermove', e => { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; });
function frame() {
  const total = track.offsetHeight - innerHeight, p = Math.min(1, Math.max(0, -track.getBoundingClientRect().top / total));
  const cam = p * (ids.length + .3) * gapZ;
  space.style.transform = `translateZ(${cam}px) rotateY(${mx * 6}deg) rotateX(${-my * 6}deg)`;
  let best = null, bd = 1e9;
  for (const c of cards) { const dd = Math.abs(c.z + cam + FOCUS); if (dd < bd) { bd = dd; best = c; } }
  for (const c of cards) c.f.classList.toggle('focus', c === best && bd < 260);
  for (const c of cards) { const d = c.z + cam; c.f.style.opacity = d > 300 ? Math.max(0, 1 - (d - 300) / 400) : Math.max(0, Math.min(1, 1 + d / 4500)); c.f.style.visibility = c.f.style.opacity > 0 ? 'visible' : 'hidden'; c.f.style.pointerEvents = d > -80 ? 'none' : 'auto'; }
  document.getElementById('intro').style.opacity = Math.max(0, 1 - p * 40);
  document.getElementById('dust').style.transform = `scale(${1 + p * 2})`;
  requestAnimationFrame(frame);
}
// snap points: one per work, where it sits right in front of you (phones use native snapping)
const coarse = matchMedia('(pointer:coarse)').matches;
function stops() { track.querySelectorAll('.stop').forEach(n => n.remove()); const total = track.offsetHeight - innerHeight, per = (ids.length + .3) * gapZ;
  [0, ...ids.map((_, i) => ((i + 1) * gapZ - FOCUS) / per)].forEach(f => { const st = document.createElement('div'); st.className = 'stop'; st.style.top = f * total + 'px'; track.append(st); });
  const end = document.createElement('div'); end.className = 'stop'; end.style.top = total + 'px'; track.append(end); }
stops(); addEventListener('resize', stops);
// on desktop, settle on the nearest work when the wheel stops
let snapT = 0;
addEventListener('scroll', () => { if (coarse) return; clearTimeout(snapT); snapT = setTimeout(() => {
  const total = track.offsetHeight - innerHeight, per = (ids.length + .3) * gapZ;
  const p = Math.min(1, Math.max(0, -track.getBoundingClientRect().top / total)), cam = p * per;
  if (p <= 0 || p >= 1) return;
  const i = Math.max(0, Math.min(ids.length - 1, Math.round((cam + FOCUS) / gapZ) - 1)), want = ((i + 1) * gapZ - FOCUS) / per;
  scrollTo({top: track.offsetTop + want * total, behavior: 'smooth'});
}, 160); }, {passive: true});
frame();
</script></body></html>
