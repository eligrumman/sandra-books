<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>אפשרות 5 · לצייר את הציור</title><link rel="stylesheet" href="../shared.css">
<style>
html,body{height:100%;overflow:hidden}
.ghost{position:fixed;inset:0;background-size:cover;background-position:center;filter:grayscale(1) brightness(.18) contrast(1.1);transform:scale(1.03);transition:background-image .6s}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.title{position:fixed;z-index:5;inset-inline-start:clamp(16px,5vw,70px);bottom:clamp(90px,14vh,140px);pointer-events:none;mix-blend-mode:difference}
.title h1{font-family:var(--serif);font-weight:300;font-size:clamp(60px,10vw,170px);line-height:.88;margin:0;letter-spacing:-.03em;color:#fff}
.title p{color:#fff;margin:16px 0 0;font-size:17px}
.controls{position:fixed;z-index:6;bottom:clamp(24px,5vh,40px);inset-inline-start:clamp(16px,5vw,70px);display:flex;gap:10px;align-items:center}
.controls button{font:inherit;font-size:14px;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.35);border-radius:30px;padding:10px 18px;cursor:pointer;backdrop-filter:blur(6px)}
.controls span{font-size:13px;color:#ddd;margin-inline-start:8px}
</style></head><body>
<header class="cbar"><a class="back" href="../">← כל האפשרויות</a><span class="name">Sandra <b>Leifer</b></span></header>
<div class="ghost" id="ghost"></div>
<canvas id="cv"></canvas>
<div class="title"><h1>תעבירו<br>את המכחול.</h1><p>הזיזו את העכבר או האצבע — והציור של סנדרה יופיע מתחת לידיים.</p></div>
<div class="controls"><button id="next">יצירה אחרת ↻</button><button id="all">לחשוף הכול</button><span id="cap"></span></div>
<script src="../../assets/js/images.js"></script><script src="../../assets/js/data.js"></script><script src="../shared.js"></script>
<script>
const seq = ['night-faces','serpent','embrace','tree-tears','star-voyage','stargaze','spiral','mosaic','blue-tree','red-forest','europa','stained'];
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const mask = document.createElement('canvas'), mctx = mask.getContext('2d');
let art = new Image(), idx = 0, W, H, dpr = Math.min(2, devicePixelRatio || 1), px = -1, py = -1, idle = 0, revealAll = 0;
function resize() { W = innerWidth; H = innerHeight; for (const c of [cv, mask]) { c.width = W * dpr; c.height = H * dpr; } mctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
function load(i) {
  idx = (i + seq.length) % seq.length; const id = seq[idx];
  const im = new Image(); im.src = C.src(id, 2400);
  im.onload = () => { art = im; mctx.clearRect(0, 0, W, H); revealAll = 0; };
  document.getElementById('ghost').style.backgroundImage = `url(${C.src(id, 800)})`;
  document.getElementById('cap').textContent = `${C.title(id)} · ${C.meta(id)}`;
}
function brush(x, y, r) {
  const g = mctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, 'rgba(0,0,0,.55)'); g.addColorStop(.6, 'rgba(0,0,0,.25)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  mctx.fillStyle = g; mctx.beginPath(); mctx.arc(x, y, r, 0, Math.PI * 2); mctx.fill();
}
function stroke(x, y) {
  const r = Math.max(60, Math.min(W, H) * .11);
  if (px < 0) { px = x; py = y; }
  const d = Math.hypot(x - px, y - py), n = Math.max(1, Math.ceil(d / (r * .2)));
  for (let k = 1; k <= n; k++) brush(px + (x - px) * k / n + (Math.random() - .5) * 8, py + (y - py) * k / n + (Math.random() - .5) * 8, r * (0.8 + Math.random() * .4));
  px = x; py = y; idle = 0;
}
function cover(img) { const s = Math.max(W / img.width, H / img.height), w = img.width * s, h = img.height * s; return [(W - w) / 2, (H - h) / 2, w, h]; }
let t = 0;
function frame() {
  t += 1; idle += 1;
  if (idle > 90 && !C.reduced) { // the brush paints by itself when nobody touches it
    const a = t / 70; stroke(W / 2 + Math.sin(a * 1.3) * W * .32, H / 2 + Math.sin(a * 2.1) * H * .3); idle = 91;
  }
  if (revealAll) { revealAll = Math.min(1, revealAll + .03); mctx.fillStyle = `rgba(0,0,0,${revealAll * .2})`; mctx.fillRect(0, 0, W, H); }
  // slow fade so the painting breathes
  mctx.globalCompositeOperation = 'destination-out'; mctx.fillStyle = `rgba(0,0,0,${revealAll ? 0 : .006})`; mctx.fillRect(0, 0, W, H); mctx.globalCompositeOperation = 'source-over';
  ctx.globalCompositeOperation = 'source-over'; ctx.clearRect(0, 0, W, H); ctx.drawImage(mask, 0, 0, W, H);
  ctx.globalCompositeOperation = 'source-in'; if (art.complete && art.width) ctx.drawImage(art, ...cover(art));
  requestAnimationFrame(frame);
}
cv.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons) stroke(e.clientX, e.clientY); });
cv.addEventListener('pointerdown', e => { px = -1; stroke(e.clientX, e.clientY); });
cv.addEventListener('pointerleave', () => px = -1);
document.getElementById('next').onclick = () => load(idx + 1);
document.getElementById('all').onclick = () => revealAll = .01;
addEventListener('resize', resize); resize(); load(0); frame();
</script></body></html>
