<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>אפשרות 3 · הליכה בתערוכה</title><link rel="stylesheet" href="../shared.css">
<style>
body{background:#16131b;transition:background-color 1s}
.track{position:relative}
.view{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.world{position:absolute;left:0;top:0;will-change:transform}
.floor{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.piece{position:absolute;margin:0;cursor:zoom-in}
.piece .frame{width:100%;height:100%;box-shadow:0 26px 70px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.07);overflow:hidden;background:#222}
.piece img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s}
.piece:hover img{transform:scale(1.04)}
.piece figcaption{position:absolute;top:100%;margin-top:14px;inset-inline-start:0;white-space:nowrap;color:#eee}
.piece figcaption b{display:block;font-family:var(--serif);font-weight:700;font-size:28px;line-height:1}
.piece figcaption span{font-size:12.5px;opacity:.7}
.spot{position:absolute;pointer-events:none;border-radius:50%;background:radial-gradient(closest-side,rgba(255,240,210,.13),transparent);transform:translate(-50%,-50%)}
.start{position:absolute;transform:translate(-50%,-100%);text-align:center;pointer-events:none;width:min(90vw,900px)}
.start h1{font-family:var(--serif);font-size:clamp(70px,11vw,170px);line-height:.85;margin:0}
.start h1 em{font-style:normal;color:#f2c94c}
.start p{color:#ccc;margin:14px 0 0}
.lb{position:fixed;z-index:120;inset:0;background:rgba(8,7,10,.95);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .3s;cursor:zoom-out}
.lb.open{opacity:1;pointer-events:auto}
.lb img{max-width:92vw;max-height:86vh;box-shadow:0 30px 90px #000}
@media(max-width:700px){.piece figcaption b{font-size:22px}}
</style></head><body>
<header class="cbar"><a class="back" href="../">← כל האפשרויות</a><span class="name">Sandra <b>Leifer</b></span></header>
<section class="track" id="track"><div class="view" id="view"><div class="world" id="world"><svg class="floor" id="floor"></svg></div></div></section>
<div class="lb" id="lb"><img id="lbimg" alt=""></div>
<script src="../../assets/js/images.js"></script><script src="../../assets/js/data.js"></script><script src="../shared.js"></script>
<script>
// A walk through the exhibition: short corridors of works, and the route turns without warning
// (left, then down, then right...). Scroll moves you along it.
const S = window.SITE, vh = () => innerHeight, mobile = innerWidth < 700;
const order = ['angels', 'flute', 'serpent', 'skull', 'night-faces', 'red-forest', 'two-profiles', 'tree-tears', 'stargaze', 'spiral', 'embrace', 'star-voyage', 'cosmic-face', 'night-light', 'mosaic', 'europa', 'lilac-dance', 'stained', 'gaze', 'smoke', 'petals', 'water-whisper', 'blue-tree', 'horse', 'alchemist'];
const sizes = [4, 2, 4, 3, 3, 2, 4, 3]; // works per corridor; the route turns after each, down corridors included
const rooms = []; for (let i = 0, k = 0; i < order.length; k++) { rooms.push({ids: order.slice(i, i + sizes[k % sizes.length])}); i += sizes[k % sizes.length]; }
const dirs = [[-1, 0], [0, 1], [1, 0], [0, 1]]; // left, down, right, down, then again
const palette = ['#1d1622', '#121a26', '#1e1a12', '#22141a', '#13201c', '#1f1626', '#201812'];
const world = document.getElementById('world'), floor = document.getElementById('floor');
const H = vh() * (mobile ? .36 : .5), GAP = mobile ? 120 : 200, GAP_V = mobile ? 140 : 170;
const pts = [[0, 0]], marks = []; let x = 0, y = 0, seg = 0;
const add = (dx, dy) => { x += dx; y += dy; pts.push([x, y]); };
function place(id, cx, baseY, h) {
  const w = h * C.ratio(id), f = document.createElement('figure'); f.className = 'piece';
  Object.assign(f.style, {left: cx - w / 2 + 'px', top: baseY - h + 'px', width: w + 'px', height: h + 'px'});
  f.innerHTML = `<div class="frame"><img src="${C.src(id, 1600)}" alt="${C.title(id)}" loading="lazy" decoding="async"></div><figcaption><b>${C.title(id)}</b><span>${C.meta(id)}</span></figcaption>`;
  f.onclick = () => { document.getElementById('lbimg').src = C.src(id, 2400); document.getElementById('lb').classList.add('open'); };
  world.append(f);
  const s = document.createElement('div'); s.className = 'spot'; Object.assign(s.style, {left: cx + 'px', top: baseY - h / 2 + 'px', width: w * 1.8 + 'px', height: h * 1.8 + 'px'}); world.prepend(s);
}
// entrance
const intro = document.createElement('div'); intro.className = 'start'; intro.style.left = '0px'; intro.style.top = '-110px';
intro.innerHTML = '<h1>סנדרה<br><em>לייפר</em></h1>'; world.append(intro);
add(-vh() * .5, 0);
rooms.forEach((room, r) => {
  const [dx, dy] = dirs[r % dirs.length];
  if (r > 0) add(dx * H * .75, dy * H * 1.05); // clear the corner so the turn never stacks works
  marks.push({at: pts.length - 1, tint: palette[r % palette.length]});
  room.ids.filter(id => C.IMG[id]).forEach((id, i) => {
    let h = H * (i % 3 === 1 ? .82 : 1), w = h * C.ratio(id);
    if (dy && w > innerWidth * .8) { w = innerWidth * .8; h = w / C.ratio(id); }
    const step = dx ? w / 2 + GAP / 2 : h / 2 + GAP_V / 2;
    add(dx * step, dy * step);
    place(id, x, y - 70, h);
    add(dx * step, dy * step);
  });
});
add(dirs[(rooms.length - 1) % dirs.length][0] * vh() * .6, dirs[(rooms.length - 1) % dirs.length][1] * vh() * .6);
// the route the camera follows (not drawn)
const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
const minX = Math.min(...xs) - 600, maxX = Math.max(...xs) + 600, minY = Math.min(...ys) - 900, maxY = Math.max(...ys) + 400;
Object.assign(floor.style, {left: minX + 'px', top: minY + 'px'});
floor.setAttribute('width', maxX - minX); floor.setAttribute('height', maxY - minY); floor.setAttribute('viewBox', `${minX} ${minY} ${maxX - minX} ${maxY - minY}`);
const d = 'M' + pts.map(p => p.join(' ')).join(' L');
floor.innerHTML = `<path class="guide" d="${d}" fill="none" stroke="none"/>`;
const path = floor.querySelector('.guide'), L = path.getTotalLength();
// scroll drives the walk
const track = document.getElementById('track');
track.style.height = (L * (mobile ? 1.1 : .9) + vh()) + 'px';
const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
let cur = 0;
function frame() {
  const total = track.offsetHeight - vh(), p = Math.min(1, Math.max(0, -track.getBoundingClientRect().top / total));
  cur += (p * L - cur) * (C.reduced ? 1 : .12);
  const pt = path.getPointAtLength(cur);
  world.style.transform = `translate3d(${innerWidth / 2 - pt.x}px, ${vh() * .8 - pt.y}px, 0)`;
  let tint = '#16131b'; for (const m of marks) if (cur >= cum[m.at] - 400) tint = m.tint;
  document.body.style.backgroundColor = tint;
  requestAnimationFrame(frame);
}
document.getElementById('lb').onclick = e => e.currentTarget.classList.remove('open');
frame();
</script></body></html>
