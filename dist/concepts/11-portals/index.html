<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>אפשרות 11 · להיכנס לתוך הציור</title><link rel="stylesheet" href="../shared.css">
<style>
html,body{height:100%;overflow:hidden;background:#06050a}
canvas{display:block;touch-action:none;cursor:pointer}
.intro{position:fixed;z-index:5;top:16vh;inset-inline:0;text-align:center;pointer-events:none;transition:opacity .6s}
.intro h1{font-family:var(--serif);font-size:clamp(60px,9vw,140px);line-height:.85;margin:0}
.intro h1 em{font-style:normal;color:var(--gold)}
.intro p{color:#bbb;margin-top:10px}
.label{position:fixed;z-index:5;bottom:calc(80px + env(safe-area-inset-bottom));inset-inline:0;text-align:center;pointer-events:none;opacity:0;transition:opacity .4s}
.label.show{opacity:1}
.label b{display:block;font-family:var(--serif);font-weight:700;font-size:clamp(36px,5vw,64px);line-height:1;text-shadow:0 2px 30px #000}
.label span{font-size:14px;color:#ddd}
.exit{position:fixed;z-index:6;bottom:calc(22px + env(safe-area-inset-bottom));inset-inline-start:50%;transform:translateX(50%);font:inherit;font-size:15px;padding:12px 24px;border-radius:30px;border:0;background:var(--paper);color:var(--ink);cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s}
.exit.show{opacity:1;pointer-events:auto}
.fade{position:fixed;inset:0;z-index:4;background:#fff;opacity:0;pointer-events:none;transition:opacity .45s}
</style>
<script type="importmap">{"imports":{"three":"../../assets/vendor/three.module.min.js"}}</script>
</head><body>
<header class="cbar"><a class="back" href="../">← כל האפשרויות</a><span class="name">Sandra <b>Leifer</b></span></header>
<div class="intro" id="intro"><h1>לא להסתכל על הציור.<br><em>להיכנס אליו.</em></h1><p>בחרו ציור ולחצו עליו</p></div>
<div class="label" id="label"><b id="lt"></b><span id="lm"></span></div>
<button class="exit" id="exit">לצאת מהציור ↩</button>
<div class="fade" id="fade"></div>
<script src="../../assets/js/images.js"></script><script src="../../assets/js/data.js"></script><script src="../shared.js"></script>
<script type="module">
import * as THREE from 'three';
const ids = ['angels', 'night-faces', 'serpent', 'flute', 'cosmic-face', 'red-forest', 'tree-tears', 'star-voyage', 'embrace'];
const renderer = new THREE.WebGLRenderer({antialias: true}); renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace; document.body.prepend(renderer.domElement);
const scene = new THREE.Scene(); scene.fog = new THREE.FogExp2('#06050a', .045);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, .05, 200); camera.position.set(0, 0, 9);
const loader = new THREE.TextureLoader(), frames = [];
// dust
const dustGeo = new THREE.BufferGeometry(), N = 1600, arr = new Float32Array(N * 3);
for (let i = 0; i < N * 3; i++) arr[i] = (Math.random() - .5) * 60; dustGeo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({color: '#e8d6b0', size: .04, transparent: true, opacity: .7})); scene.add(dust);
// works floating on a gentle arc
ids.forEach((id, i) => {
  const r = C.ratio(id), h = 2.4, w = h * r, a = (i - (ids.length - 1) / 2) * .42;
  const g = new THREE.Group(); g.position.set(Math.sin(a) * 11, Math.sin(i * 1.7) * .9, 9 - Math.cos(a) * 11 - 2); g.lookAt(0, 0, 9);
  const mat = new THREE.MeshBasicMaterial({color: '#111'});
  const pic = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat); g.add(pic);
  const glow = new THREE.Mesh(new THREE.PlaneGeometry(w + .14, h + .14), new THREE.MeshBasicMaterial({color: '#d8b27a', transparent: true, opacity: .0})); glow.position.z = -.01; g.add(glow);
  loader.load(C.src(id, 1600), t => { t.colorSpace = THREE.SRGBColorSpace; mat.map = t; mat.color.set('#fff'); mat.needsUpdate = true; frames[i].tex = t; });
  pic.userData.i = i; scene.add(g); frames.push({id, g, pic, glow, base: g.position.clone(), phase: Math.random() * 6});
});
// the inside of a painting: a sphere wrapped in the work, mirrored so it closes seamlessly around you
const sphereMat = new THREE.MeshBasicMaterial({side: THREE.BackSide, transparent: true, opacity: 0});
const sphere = new THREE.Mesh(new THREE.SphereGeometry(30, 64, 40), sphereMat); scene.add(sphere); sphere.visible = false;
let inside = -1, flying = null, yaw = 0, pitch = 0, mx = 0, my = 0;
const ray = new THREE.Raycaster(), v2 = new THREE.Vector2();
let hover = -1;
addEventListener('pointermove', e => { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5;
  if (inside < 0 && !flying) { v2.set(mx * 2, -my * 2); ray.setFromCamera(v2, camera); const h = ray.intersectObjects(frames.map(f => f.pic))[0]; setHover(h ? h.object.userData.i : -1); } });
function setHover(i) { hover = i; frames.forEach((f, k) => f.glow.material.opacity = k === i ? .9 : 0); const l = document.getElementById('label');
  if (i >= 0) { document.getElementById('lt').textContent = C.title(frames[i].id); document.getElementById('lm').textContent = C.meta(frames[i].id); l.classList.add('show'); } else if (inside < 0) l.classList.remove('show'); }
let down = null;
renderer.domElement.addEventListener('pointerdown', e => down = {x: e.clientX, y: e.clientY, m: 0});
addEventListener('pointerup', e => { if (!down) return; const moved = Math.abs(e.clientX - down.x) + Math.abs(e.clientY - down.y); down = null;
  if (moved > 6 || flying) return;
  if (inside < 0) { v2.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(v2, camera); const h = ray.intersectObjects(frames.map(f => f.pic))[0]; if (h) enter(h.object.userData.i); } });
addEventListener('pointermove', e => { if (down && inside >= 0) { yaw -= (e.movementX || 0) * .004; pitch = Math.max(-1.2, Math.min(1.2, pitch - (e.movementY || 0) * .004)); } });
function enter(i) {
  const f = frames[i], to = f.g.position.clone(), from = camera.position.clone();
  document.getElementById('intro').style.opacity = 0;
  flying = {t: 0, from, to, look: to.clone(), dir: 1, i};
}
function arrive(i) {
  const t = frames[i].tex.clone(); t.wrapS = THREE.MirroredRepeatWrapping; t.repeat.set(4, 1); t.needsUpdate = true;
  sphereMat.map = t; sphereMat.needsUpdate = true; sphere.visible = true; sphere.position.copy(camera.position); inside = i; yaw = 0; pitch = 0;
  frames.forEach(f => f.g.visible = false); dust.visible = true;
  document.getElementById('exit').classList.add('show');
}
document.getElementById('exit').onclick = () => {
  const fade = document.getElementById('fade'); fade.style.opacity = .9;
  setTimeout(() => { sphere.visible = false; sphereMat.opacity = 0; frames.forEach(f => f.g.visible = true); camera.position.set(0, 0, 9); camera.rotation.set(0, 0, 0); inside = -1; fade.style.opacity = 0;
    document.getElementById('exit').classList.remove('show'); document.getElementById('intro').style.opacity = 1; setHover(-1); }, 450);
};
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(.05, clock.getDelta()), t = clock.elapsedTime;
  frames.forEach(f => { f.g.position.y = f.base.y + Math.sin(t * .6 + f.phase) * .12; });
  dust.rotation.y += dt * .01;
  if (flying) {
    flying.t = Math.min(1, flying.t + dt / 1.5); const e = flying.t * flying.t * (3 - 2 * flying.t);
    camera.position.lerpVectors(flying.from, flying.to, e * .97); camera.lookAt(flying.look);
    if (flying.t > .75) document.getElementById('fade').style.opacity = (flying.t - .75) * 4;
    if (flying.t >= 1) { const i = flying.i; flying = null; arrive(i); document.getElementById('fade').style.opacity = 0; }
  } else if (inside >= 0) {
    sphereMat.opacity = Math.min(1, sphereMat.opacity + dt * 1.2);
    if (!down) yaw += dt * .05;
    camera.rotation.set(pitch, yaw, 0, 'YXZ');
  } else {
    camera.position.x += (mx * 3 - camera.position.x) * .04; camera.position.y += (-my * 1.6 - camera.position.y) * .04; camera.lookAt(0, 0, -2);
  }
  renderer.render(scene, camera); requestAnimationFrame(tick);
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
tick();
</script></body></html>
