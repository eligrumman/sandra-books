<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>אפשרות 2 · קיר אינסופי</title><link rel="stylesheet" href="../shared.css">
<style>
html{scroll-behavior:smooth}
body{overscroll-behavior:none}
.wall{position:relative;height:100vh;height:100svh;overflow:hidden}
.world{position:absolute;inset:0;cursor:grab;touch-action:none;background:#0b0a0f}
.world.drag{cursor:grabbing}
.tile{position:absolute;top:0;left:0;will-change:transform;border-radius:4px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.5);transition:filter .4s}
.tile img{width:100%;height:100%;object-fit:cover;pointer-events:none;user-select:none}
.world:hover .tile{filter:saturate(.85) brightness(.8)}
.world .tile:hover{filter:none}
.down{position:absolute;z-index:30;bottom:calc(22px + env(safe-area-inset-bottom));inset-inline-start:22px;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.85);color:#fff;font-size:24px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:bob 2.4s ease-in-out infinite;transition:background .25s}
.down:hover{background:rgba(255,255,255,.22)}
@keyframes bob{50%{transform:translateY(6px)}}
.more{min-height:100vh;padding:110px clamp(16px,6vw,90px) 70px;background:#f4efe6;color:#1a1520}
.more h2{font-family:var(--serif);font-size:clamp(56px,8vw,120px);line-height:.88;margin:0 0 30px}
.more .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:16px}
.more a{display:block;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.more a img{width:100%;aspect-ratio:4/3;object-fit:cover}
.more a b{display:block;font-family:var(--serif);font-size:34px;padding:12px 16px 0}
.more a span{display:block;padding:0 16px 16px;color:#6b605a;font-size:14px}
.view{position:fixed;z-index:50;inset:0;background:rgba(8,7,10,.96);display:grid;grid-template-rows:1fr auto;opacity:0;pointer-events:none;transition:opacity .35s}
.view.open{opacity:1;pointer-events:auto}
.view img{max-width:92vw;max-height:80vh;margin:auto;align-self:center;object-fit:contain;box-shadow:0 30px 90px #000;transform:scale(.94);transition:transform .5s cubic-bezier(.2,.7,.1,1)}
.view.open img{transform:none}
.view .cap{text-align:center;padding:16px 16px 34px}
.view h2{font-family:var(--serif);font-weight:300;font-size:32px;margin:0}
.view p{margin:4px 0 0;color:#aaa;font-size:14px}
</style></head><body>
<header class="cbar"><a class="back" href="../">← כל האפשרויות</a><span class="name">Sandra <b>Leifer</b></span></header>
<section class="wall" id="wall"><div class="world" id="world"></div><a class="down" href="#more" aria-label="להמשיך באתר">↓</a></section>
<section class="more" id="more"><h2>ועוד<br>מסנדרה.</h2><div class="cards">
<a href="../../#studio"><img src="../../assets/img/studio/ws-8.webp" alt=""><b>סדנאות</b><span>נוירוגרפיקה וצבע, לילדים ולמבוגרים</span></a>
<a href="../../#exhibition"><img src="../../assets/img/studio/hall-1.webp" alt=""><b>התערוכה</b><span>העבודות על הקירות של הגלריה</span></a>
<a href="../../#stories"><img src="../../assets/img/dragon-cover-900.webp" alt=""><b>אגדות</b><span>החד־קרן והדרקון</span></a>
<a href="../../#about"><img src="../../assets/img/portrait-900.webp" alt=""><b>סנדרה</b><span>נעים להכיר</span></a>
</div></section>
<div class="view" id="view"><img id="vimg" alt=""><div class="cap"><h2 id="vt"></h2><p id="vm"></p></div></div>
<script src="../../assets/js/images.js"></script><script src="../../assets/js/data.js"></script><script src="../shared.js"></script>
<script>
const world = document.getElementById('world'), view = document.getElementById('view');
const ids = C.best;
// Lay works out in columns of a block; the block repeats in both directions.
const mobile = innerWidth < 700, colW = mobile ? 170 : 300, gap = mobile ? 22 : 46, cols = mobile ? 5 : 6;
const colsY = Array.from({length: cols}, (_, c) => (c % 2) * colW * .45);
const items = [];
ids.forEach((id, k) => {
  const c = k % cols, w = colW * (0.85 + ((k * 37) % 5) * 0.08), h = w / C.ratio(id);
  items.push({id, x: c * (colW + gap) + (colW - w) / 2, y: colsY[c], w, h}); colsY[c] += h + gap;
});
const BW = cols * (colW + gap), BH = Math.max(...colsY);
const reps = []; // enough copies to cover the viewport
const nx = Math.ceil(innerWidth / BW) + 1, ny = Math.ceil(innerHeight / BH) + 1;
for (let a = 0; a < nx; a++) for (let b = 0; b < ny; b++) items.forEach(it => {
  const el = document.createElement('div'); el.className = 'tile'; el.style.width = it.w + 'px'; el.style.height = it.h + 'px';
  const im = new Image(); im.src = C.src(it.id, 800); im.alt = C.title(it.id); im.decoding = 'async'; im.loading = 'lazy'; el.append(im);
  el.dataset.id = it.id; world.append(el); reps.push({el, x: it.x + a * BW, y: it.y + b * BH, w: it.w, h: it.h});
});
const W = nx * BW, H = ny * BH;
let ox = -BW * .2, oy = -BH * .15, vx = 0, vy = 0, down = false, lx = 0, ly = 0, moved = 0;
const mod = (n, m) => ((n % m) + m) % m;
function render() {
  const cx = innerWidth / 2, cy = innerHeight / 2;
  for (const r of reps) {
    const x = mod(r.x + ox + r.w, W) - r.w, y = mod(r.y + oy + r.h, H) - r.h;
    const dx = (x + r.w / 2 - cx) / innerWidth, dy = (y + r.h / 2 - cy) / innerHeight;
    const s = 1.08 - Math.min(.22, Math.hypot(dx, dy) * .28);
    r.el.style.transform = `translate3d(${x}px,${y}px,0) scale(${s})`;
  }
}
// With a mouse, the wall glides toward wherever the pointer is (faster near the edges, still in the middle).
let mx = null, my = null; const DRIFT = .7; // the wall drifts left and down when left alone
addEventListener('pointermove', e => { if (e.pointerType === 'mouse') { mx = e.clientX; my = e.clientY; } });
document.addEventListener('mouseleave', () => { mx = my = null; });
function loop() {
  if (!down) {
    if (mx !== null && !view.classList.contains('open')) {
      const nx = (mx / innerWidth - .5) * 2, ny = (my / innerHeight - .5) * 2, dead = .18;
      const fx = Math.sign(nx) * Math.max(0, Math.abs(nx) - dead) / (1 - dead), fy = Math.sign(ny) * Math.max(0, Math.abs(ny) - dead) / (1 - dead);
      const idle = Math.abs(fx) + Math.abs(fy) < .01 && !C.reduced; // pointer resting in the middle: keep drifting
      vx += ((idle ? -DRIFT : -fx * 9) - vx) * .06; vy += ((idle ? DRIFT * .6 : -fy * 9) - vy) * .06;
    } else { vx += ((C.reduced ? 0 : -DRIFT) - vx) * .03; vy += ((C.reduced ? 0 : DRIFT * .6) - vy) * .03; }
    ox += vx; oy += vy;
  }
  if (visible) render(); requestAnimationFrame(loop);
}
world.addEventListener('pointerdown', e => { down = true; moved = 0; lx = e.clientX; ly = e.clientY; vx = vy = 0; world.classList.add('drag'); world.setPointerCapture(e.pointerId); });
world.addEventListener('pointermove', e => { if (!down) return; const dx = e.clientX - lx, dy = e.clientY - ly; ox += dx; oy += dy; vx = dx; vy = dy; moved += Math.abs(dx) + Math.abs(dy); lx = e.clientX; ly = e.clientY; });
world.addEventListener('pointerup', e => {
  down = false; world.classList.remove('drag');
  if (moved < 6) { const t = document.elementsFromPoint(e.clientX, e.clientY).find(n => n.classList?.contains('tile')); if (t) open(t.dataset.id); }
});
world.addEventListener('wheel', e => { if (scrollY > 10) return; e.preventDefault(); vx -= e.deltaX * .08; vy -= e.deltaY * .08; }, {passive: false});
function open(id) { document.getElementById('vimg').src = C.src(id, 2400); document.getElementById('vt').textContent = C.title(id); document.getElementById('vm').textContent = C.meta(id); view.classList.add('open'); }
view.addEventListener('click', () => view.classList.remove('open'));
addEventListener('keydown', e => { if (e.key === 'Escape') view.classList.remove('open'); });
let visible = true; new IntersectionObserver(([en]) => visible = en.isIntersecting).observe(document.getElementById('wall'));
loop();
</script></body></html>
