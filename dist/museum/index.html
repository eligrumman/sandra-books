}
const onCanvas = id => /холст/i.test(CATALOG[id].med[1]);
const size = id => work(id).s.split('×').map(n => parseFloat(n) / 100); // catalog "W × H" in cm
const MAT = .08, BORDER = .025, LABEL = {w: .3, h: .15, gap: .08}, SPACE = .7;
const frameOf = id => { const [w, h] = size(id), k = onCanvas(id) ? .025 : MAT + BORDER; return {w, h, fw: w + 2 * k, fh: h + 2 * k, canvas: onCanvas(id)}; };
const unit = id => frameOf(id).fw + LABEL.gap + LABEL.w;
// rooms in visiting order; each has its own wall colour and light
const ROOMS = [
  {kind: 'paint', wall: '#ece6dc', ink: '#2a2420', sub: '#7a6a5a', light: '#fff4e2'},
  {kind: 'hidden', wall: '#27294a', ink: '#f1e9dc', sub: '#b9b3d6', light: '#e6e2ff'},
  {kind: 'neuro', wall: '#f4f3ef', ink: '#1b1b1f', sub: '#6b6b74', light: '#ffffff'}
];

let z = 0;

  // canvases first, so the big works face you as you come in
  r.works = all.filter(id => work(id).kind === r.kind).sort((a, b) => onCanvas(b) - onCanvas(a));
  const last = i === ROOMS.length - 1, side = W / 2 - EDGE - DOOR.w / 2 - .5;
  const backFront = (last ? W - 2 * EDGE : 2 * side) + 2 * side;
  const need = r.works.reduce((a, id) => a + unit(id) + SPACE, 0);
  r.d = Math.max(7, Math.ceil((need - backFront) / 2 + 2 * EDGE));

/* ---------- scene ---------- */
const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.25;

camera.position.set(0, 1.65, ROOMS[0].front - 2);

const sun = new THREE.DirectionalLight('#ffffff', .35); sun.position.set(3, 8, 4); scene.add(sun);

// textures drawn on canvases; the ones with words are redrawn when the language changes
const live = [];
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);

const fontOf = () => lang === 'ru' ? 'Comfortaa' : 'Fredoka';

const length = -z;
const floorTex = canvasTex(1024, 1024, (g, w, h) => {
  for (let i = 0; i < 8; i++) { const y = i * h / 8; g.fillStyle = `hsl(28,${30 + (i * 7) % 10}%,${26 + (i * 13) % 8}%)`; g.fillRect(0, y, w, h / 8);
    for (let k = 0; k < 60; k++) { g.strokeStyle = `rgba(0,0,0,${Math.random() * .12})`; g.beginPath(); const yy = y + Math.random() * h / 8; g.moveTo(0, yy); g.bezierCurveTo(w / 3, yy + 4, w * 2 / 3, yy - 4, w, yy); g.stroke(); }
    g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(0, y, w, 2); g.fillRect((i % 2) * w / 2, y, 2, h / 8); }
}, [W / 4, length / 4]);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, length), new THREE.MeshStandardMaterial({map: floorTex, roughness: .55, metalness: .05}));

const pool = hex => canvasTex(256, 256, (g, w, h) => { const c = new THREE.Color(hex), rgb = `${c.r * 255 | 0},${c.g * 255 | 0},${c.b * 255 | 0}`; const r = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2); r.addColorStop(0, `rgba(${rgb},.55)`); r.addColorStop(1, `rgba(${rgb},0)`); g.fillStyle = r; g.fillRect(0, 0, w, h); });

    glide.t = Math.min(1, glide.t + dt / glide.dur); const g = glide, e = g.t < .5 ? 2 * g.t * g.t : 1 - Math.pow(-2 * g.t + 2, 2) / 2;
    camera.position.copy(along(g, e));
    // walking through rooms: face the way you go, then turn to the work
    if (g.walk) yaw = e < .25 ? turn(g.yaw0, g.yawWalk, e / .25) : e < .75 ? g.yawWalk : turn(g.yawWalk, g.yawWalk + ((g.yaw1 - g.yawWalk + Math.PI * 3) % (Math.PI * 2) - Math.PI), (e - .75) / .25);
    else yaw = turn(g.yaw0, g.yaw1, e);
    pitch = g.p0 * (1 - e);
    if (g.t >= 1) { glide = null; focused = current; if (zoomAfter === current) { zoomAfter = -1; openZoom(current); } }
  } else {
    camera.position.addScaledVector(fwd, mv * 3.2 * dt).addScaledVector(side, st * 2.6 * dt);
    collide(camera.position, prevZ);
    if (Math.abs(mv) > .05 || Math.abs(st) > .05) camera.position.y += (1.65 - camera.position.y) * Math.min(1, dt * 3); // back to eye height only when walking
    const f = facing(); if (f !== shown) { showLabel(f); if (f >= 0) current = f; }
  }
  camera.rotation.set(pitch, yaw, 0);
  renderer.render(scene, camera); requestAnimationFrame(tick);
}
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
