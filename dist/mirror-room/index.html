.cbar .right{display:flex;gap:10px;align-items:center}
.langs{display:flex;background:rgba(14,12,18,.82);border:1px solid rgba(255,255,255,.2);border-radius:30px;padding:3px}
.langs button{font:inherit;font-size:12.5px;color:#ddd;background:none;border:0;border-radius:30px;padding:5px 10px;cursor:pointer;min-height:30px}
.langs button[aria-pressed=true]{background:var(--paper);color:var(--ink)}
@media (max-width:520px){.cbar .name{display:none}.cbar{padding:12px 16px}}
.hint{position:fixed;z-index:20;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);text-align:center;font-size:13.5px;line-height:1.6;color:#f1ece4;background:rgba(14,12,18,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.16);padding:9px 16px;border-radius:14px;transition:opacity .6s;pointer-events:none}
.hint.hide{opacity:0}
.ring{position:fixed;z-index:15;pointer-events:none}
.fallback{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#0c0b0f;text-align:center;padding:24px}
.fallback[hidden]{display:none}
.fallback p{font-size:18px;max-width:28em;margin:0 auto 20px;line-height:1.6}
.fallback a{display:inline-block;padding:12px 26px;border-radius:40px;background:var(--paper);color:var(--ink)}
/* the photo list that the lightbox walks through: hidden from the eye, reachable by keyboard and screen readers */
.mr-list{position:fixed;inset-inline-start:0;bottom:0;margin:0;padding:0;list-style:none;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.mr-list:focus-within{width:auto;height:auto;clip-path:none;z-index:30;background:rgba(14,12,18,.95);padding:8px 12px;border-radius:0 12px 0 0}
.mr-list .ba-item{display:inline-block;margin:0 6px;background:none;overflow:visible}
.mr-list .ba-item img{display:none}
.mr-list .ba-item a::after{content:attr(aria-label);font-size:13px;color:#fff}
.ba-lb button{font:inherit;color:inherit;background:none;cursor:pointer}
.ba-lb{font-family:var(--sans)}
body,button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
